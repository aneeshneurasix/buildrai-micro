version: 0.2

# BuildSpec for building and pushing Docker images to ECR
# Builds all 4 microservices in parallel

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URL
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Building images with tag $IMAGE_TAG"

  build:
    commands:
      - echo "Building Docker images for all services..."

      # Build AI Service
      - echo "Building AI Service..."
      - cd ai-service
      - npm install
      - cd ..
      - docker build -t $ECR_REPOSITORY_URL:ai-service-$IMAGE_TAG -f ai-service/Dockerfile ai-service/
      - docker tag $ECR_REPOSITORY_URL:ai-service-$IMAGE_TAG $ECR_REPOSITORY_URL:ai-service-latest

      # Build Auth Service
      - echo "Building Auth Service..."
      - cd auth-service
      - npm install
      - cd ..
      - docker build -t $ECR_REPOSITORY_URL:auth-service-$IMAGE_TAG -f auth-service/Dockerfile auth-service/
      - docker tag $ECR_REPOSITORY_URL:auth-service-$IMAGE_TAG $ECR_REPOSITORY_URL:auth-service-latest

      # Build Worker Service
      - echo "Building Worker Service..."
      - cd worker-service
      - npm install
      - cd ..
      - docker build -t $ECR_REPOSITORY_URL:worker-service-$IMAGE_TAG -f worker-service/Dockerfile worker-service/
      - docker tag $ECR_REPOSITORY_URL:worker-service-$IMAGE_TAG $ECR_REPOSITORY_URL:worker-service-latest

      # Build API Service
      - echo "Building API Service..."
      - cd api-service
      - npm install
      - cd ..
      - docker build -t $ECR_REPOSITORY_URL:api-service-$IMAGE_TAG -f api-service/Dockerfile api-service/
      - docker tag $ECR_REPOSITORY_URL:api-service-$IMAGE_TAG $ECR_REPOSITORY_URL:api-service-latest

  post_build:
    commands:
      - echo "Pushing Docker images to ECR..."

      # Push AI Service
      - docker push $ECR_REPOSITORY_URL:ai-service-$IMAGE_TAG
      - docker push $ECR_REPOSITORY_URL:ai-service-latest

      # Push Auth Service
      - docker push $ECR_REPOSITORY_URL:auth-service-$IMAGE_TAG
      - docker push $ECR_REPOSITORY_URL:auth-service-latest

      # Push Worker Service
      - docker push $ECR_REPOSITORY_URL:worker-service-$IMAGE_TAG
      - docker push $ECR_REPOSITORY_URL:worker-service-latest

      # Push API Service
      - docker push $ECR_REPOSITORY_URL:api-service-$IMAGE_TAG
      - docker push $ECR_REPOSITORY_URL:api-service-latest

      - echo "Build completed on `date`"
      - echo "Images pushed with tag $IMAGE_TAG and latest"

artifacts:
  files:
    - '**/*'
  name: BuildArtifact

cache:
  paths:
    - '/root/.npm/**/*'
    - 'node_modules/**/*'
    - '*/node_modules/**/*'
