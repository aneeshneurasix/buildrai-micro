version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: codstack-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: codstack
    volumes:
      - mongodb_data:/data/db
    networks:
      - codstack-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: codstack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - codstack-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: codstack-ai-service
    ports:
      - "4000:4000"
    env_file:
      - ./ai-service/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/codstack
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:4001
      - API_SERVICE_URL=http://api-service:3001
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codstack-network
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: codstack-auth-service
    ports:
      - "4001:4001"
    env_file:
      - ./auth-service/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/codstack
      - REDIS_URL=redis://redis:6379
      - API_SERVICE_URL=http://api-service:3001
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codstack-network
    restart: unless-stopped

  # API Service
  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: codstack-api-service
    ports:
      - "3001:3001"
    env_file:
      - ./api-service/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/codstack
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:4001
      - AI_SERVICE_URL=http://ai-service:4000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codstack-network
    restart: unless-stopped

  # Worker Service
  worker-service:
    build:
      context: ./worker-service
      dockerfile: Dockerfile
    container_name: codstack-worker-service
    env_file:
      - ./worker-service/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/codstack
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:4001
      - AI_SERVICE_URL=http://ai-service:4000
      - API_SERVICE_URL=http://api-service:3001
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - codstack-network
    restart: unless-stopped

networks:
  codstack-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
