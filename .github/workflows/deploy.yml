name: Deploy Microservices

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: builderai-microservice

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build shared library
        run: |
          cd shared
          npm install
          npm run build

      - name: Build and push AI Service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:ai-service-$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:ai-service-latest \
            -f ai-service/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:ai-service-$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:ai-service-latest

      - name: Build and push Auth Service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:auth-service-$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:auth-service-latest \
            -f auth-service/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:auth-service-$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:auth-service-latest

      - name: Build and push Worker Service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:worker-service-$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:worker-service-latest \
            -f worker-service/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:worker-service-$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:worker-service-latest

      - name: Build and push API Service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:api-service-$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:api-service-latest \
            -f api-service/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:api-service-$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:api-service-latest

      - name: Build and deploy frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd frontend
          npm install
          npm run build
          aws s3 sync out/ s3://builderai-frontend-production --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Update ECS services
        run: |
          aws ecs update-service --cluster builderai-cluster --service builderai-ai-service --force-new-deployment
          aws ecs update-service --cluster builderai-cluster --service builderai-auth-service --force-new-deployment
          aws ecs update-service --cluster builderai-cluster --service builderai-worker-service --force-new-deployment
          aws ecs update-service --cluster builderai-cluster --service builderai-api-service --force-new-deployment

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable --cluster builderai-cluster --services \
            builderai-ai-service \
            builderai-auth-service \
            builderai-worker-service \
            builderai-api-service

      - name: Deployment successful
        run: echo "✅ Deployment completed successfully!"
